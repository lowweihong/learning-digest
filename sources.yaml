# Sources the daily pipeline checks for new videos.
# Each entry: a type, a url, and an optional name. Supported types:
#   youtube_channel  - a channel URL or @handle URL (its /videos tab is scanned)
#   youtube_playlist - a playlist URL
#   rss              - any RSS/Atom feed whose items link to videos (YouTube or anything yt-dlp supports)
#   video            - one specific video (processed once)
#   course_page      - a course website; every YouTube video/playlist it links is taken in page order,
#                      starting from lecture 1 (max_per_run lectures per day). Re-scanned daily for new uploads.
#                      Add `slides: true` to also take lecture slide PDFs (for courses without video).
#
# max_per_run caps how many new videos one daily run processes (the rest wait for the next day).
# initial_backfill: on the first scan of a channel/playlist/feed, queue only its newest N videos
#   (older ones are marked skipped so the back catalogue never floods the digest).
# scan_depth: how many of the newest items per source are checked each run.

max_per_run: 3
initial_backfill: 1
scan_depth: 15

sources:
  - type: video
    url: https://youtu.be/Qg_3N8pdK9s
    name: Sample lesson
  - type: course_page
    url: https://hanlab.mit.edu/courses/2026-fall-65940
    name: MIT 6.5940 (Fall 2026)
  - type: course_page
    url: https://cs329z.stanford.edu/
    name: Stanford CS329Z (Engineering AI Agents)
    slides: true   # course posts slide PDFs, no lecture videos
